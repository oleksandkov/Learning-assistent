<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 560" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="gost-arrow-v1-3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .block { stroke: #000000; stroke-width: 1.5; fill: #ffffff; }
      .txt { font-size: 13px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-size: 12px; font-weight: 600; fill: #000000; }
    </style>
  </defs>

  <!-- 1. Початок -->
  <rect x="150" y="20" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="39" class="txt">Початок</text>

  <!-- Лінія до введення -->
  <line x1="225" y1="58" x2="225" y2="86" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 2. Введення даних -->
  <polygon points="140,86 330,86 310,126 120,126" class="block" />
  <text x="225" y="106" class="txt">Введення: n, arr[0..n-1]</text>

  <!-- Лінія до ініціалізації -->
  <line x1="225" y1="126" x2="225" y2="154" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 3. Ініціалізація -->
  <rect x="145" y="154" width="160" height="40" class="block" />
  <text x="225" y="174" class="txt">сума = 0</text>

  <!-- Лінія до блоку підготовки -->
  <line x1="225" y1="194" x2="225" y2="222" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 4. Блок підготовки (Цикл For за ГОСТ 19.701: шестикутник) -->
  <polygon points="160,222 290,222 315,244 290,266 160,266 135,244" class="block" />
  <text x="225" y="244" class="txt">i = 0, n - 1, 1</text>

  <!-- Лінія в тіло циклу -->
  <line x1="225" y1="266" x2="225" y2="298" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 5. Дія в циклі -->
  <rect x="135" y="298" width="180" height="40" class="block" />
  <text x="225" y="318" class="txt">сума = сума + arr[i]</text>

  <!-- Зворотна лінія повернення циклу до блоку підготовки -->
  <line x1="225" y1="338" x2="225" y2="362" class="line" />
  <line x1="225" y1="362" x2="95" y2="362" class="line" />
  <line x1="95" y1="362" x2="95" y2="244" class="line" />
  <line x1="95" y1="244" x2="135" y2="244" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- Вихід з циклу For (за стандартом ГОСТ: праворуч з вершини шестикутника) -->
  <line x1="315" y1="244" x2="375" y2="244" class="line" />
  <line x1="375" y1="244" x2="375" y2="390" class="line" />
  <line x1="375" y1="390" x2="225" y2="390" class="line" />
  <line x1="225" y1="390" x2="225" y2="414" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 6. Виведення результату -->
  <polygon points="150,414 320,414 300,454 130,454" class="block" />
  <text x="225" y="434" class="txt">Виведення: сума</text>

  <!-- Лінія до кінця -->
  <line x1="225" y1="454" x2="225" y2="484" class="line" marker-end="url(#gost-arrow-v1-3)" />

  <!-- 7. Кінець -->
  <rect x="150" y="484" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="503" class="txt">Кінець</text>
</svg>
