<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="uml-arrow-v1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .uml-line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .uml-action { stroke: #000000; stroke-width: 1.5; fill: #ffffff; rx: 8px; ry: 8px; }
      .uml-text { font-size: 13px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .uml-guard { font-size: 11px; font-weight: 600; fill: #000000; }
      .uml-bar { fill: #000000; rx: 2px; ry: 2px; }
    </style>
  </defs>

  <!-- 1. Початковий вузол (чорний круг) -->
  <circle cx="240" cy="30" r="11" fill="#000000" />

  <!-- Лінія до першої дії -->
  <line x1="240" y1="41" x2="240" y2="72" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- 2. Дія: Отримання запиту -->
  <rect x="135" y="72" width="210" height="40" class="uml-action" />
  <text x="240" y="92" class="uml-text">Зчитування конфігурації</text>

  <!-- Лінія до ромба рішення -->
  <line x1="240" y1="112" x2="240" y2="142" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- 3. Ромб рішення (Decision Node) -->
  <polygon points="240,142 270,165 240,188 210,165" stroke="#000000" stroke-width="1.5" fill="#ffffff" />

  <!-- Гілка [помилка] (праворуч) -->
  <line x1="270" y1="165" x2="385" y2="165" class="uml-line" />
  <text x="278" y="157" class="uml-guard">[помилка]</text>
  <line x1="385" y1="165" x2="385" y2="215" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- Дія помилки -->
  <rect x="310" y="215" width="150" height="40" class="uml-action" />
  <text x="385" y="235" class="uml-text">Запис у журнал</text>

  <!-- Лінія від помилки до фіналу -->
  <line x1="385" y1="255" x2="385" y2="480" class="uml-line" />
  <line x1="385" y1="480" x2="255" y2="480" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- Гілка [успішно] (вниз) -->
  <line x1="240" y1="188" x2="240" y2="225" class="uml-line" marker-end="url(#uml-arrow-v1)" />
  <text x="248" y="206" class="uml-guard">[успішно]</text>

  <!-- 4. Смуга паралелізму (Fork Bar) -->
  <rect x="130" y="225" width="220" height="5" class="uml-bar" />

  <!-- Лінії паралельних процесів -->
  <line x1="170" y1="230" x2="170" y2="265" class="uml-line" marker-end="url(#uml-arrow-v1)" />
  <line x1="310" y1="230" x2="310" y2="265" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- Паралельна дія 1 -->
  <rect x="95" y="265" width="150" height="40" class="uml-action" />
  <text x="170" y="285" class="uml-text">Ініціалізація бази</text>

  <!-- Паралельна дія 2 -->
  <rect x="255" y="265" width="150" height="40" class="uml-action" />
  <text x="330" y="285" class="uml-text">Запуск веб-сервера</text>

  <!-- Лінії до Join Bar -->
  <line x1="170" y1="305" x2="170" y2="340" class="uml-line" />
  <line x1="310" y1="305" x2="310" y2="340" class="uml-line" />

  <!-- 5. Смуга злиття (Join Bar) -->
  <rect x="130" y="340" width="220" height="5" class="uml-bar" />

  <!-- Лінія до наступної дії -->
  <line x1="240" y1="345" x2="240" y2="378" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- 6. Підсумкова дія -->
  <rect x="135" y="378" width="210" height="40" class="uml-action" />
  <text x="240" y="398" class="uml-text">Реєстрація маршрутів</text>

  <!-- Лінія до фіналу -->
  <line x1="240" y1="418" x2="240" y2="466" class="uml-line" marker-end="url(#uml-arrow-v1)" />

  <!-- 7. Вузол завершення діяльності (Activity Final Node: бичаче око) -->
  <circle cx="240" cy="480" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <circle cx="240" cy="480" r="8" fill="#000000" />
</svg>
