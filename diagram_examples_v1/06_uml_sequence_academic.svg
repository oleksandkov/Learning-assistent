<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Sync call arrow -->
    <marker id="seq-arr-v1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Return open arrow -->
    <marker id="seq-open-v1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
    </marker>
    <style>
      .seq-line { stroke: #000000; stroke-width: 1; stroke-dasharray: 4,4; }
      .seq-msg { stroke: #000000; stroke-width: 1.5; fill: none; }
      .seq-ret { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
      .seq-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .seq-act { fill: #ffffff; stroke: #000000; stroke-width: 1.25; }
      .seq-txt { font-size: 12px; font-weight: 600; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .seq-lbl { font-size: 11px; fill: #000000; }
      .seq-alt { stroke: #000000; stroke-width: 1; stroke-dasharray: 3,3; fill: none; }
    </style>
  </defs>

  <!-- 4 Учасники -->
  <!-- 1. Користувач (X=80) -->
  <rect x="25" y="20" width="110" height="34" class="seq-box" />
  <text x="80" y="37" class="seq-txt">Користувач</text>
  <line x1="80" y1="54" x2="80" y2="430" class="seq-line" />

  <!-- 2. Веб-інтерфейс (X=230) -->
  <rect x="175" y="20" width="110" height="34" class="seq-box" />
  <text x="230" y="37" class="seq-txt">Інтерфейс</text>
  <line x1="230" y1="54" x2="230" y2="430" class="seq-line" />

  <!-- 3. Сервер (X=390) -->
  <rect x="335" y="20" width="110" height="34" class="seq-box" />
  <text x="390" y="37" class="seq-txt">Сервер</text>
  <line x1="390" y1="54" x2="390" y2="430" class="seq-line" />

  <!-- 4. База даних (X=540) -->
  <rect x="485" y="20" width="110" height="34" class="seq-box" />
  <text x="540" y="37" class="seq-txt">База даних</text>
  <line x1="540" y1="54" x2="540" y2="430" class="seq-line" />

  <!-- Смуги активності -->
  <rect x="75" y="75" width="10" height="40" class="seq-act" />
  <rect x="225" y="80" width="10" height="320" class="seq-act" />
  <rect x="385" y="95" width="10" height="260" class="seq-act" />
  <rect x="535" y="125" width="10" height="45" class="seq-act" />

  <!-- Виклик 1 -->
  <line x1="85" y1="85" x2="225" y2="85" class="seq-msg" marker-end="url(#seq-arr-v1)" />
  <text x="155" y="78" class="seq-lbl" text-anchor="middle">1: Натискання &quot;Увійти&quot;</text>

  <!-- Виклик 2 -->
  <line x1="235" y1="100" x2="385" y2="100" class="seq-msg" marker-end="url(#seq-arr-v1)" />
  <text x="310" y="93" class="seq-lbl" text-anchor="middle">2: POST /api/авторизація</text>

  <!-- Виклик 3 -->
  <line x1="395" y1="130" x2="535" y2="130" class="seq-msg" marker-end="url(#seq-arr-v1)" />
  <text x="465" y="123" class="seq-lbl" text-anchor="middle">3: ЗнайтиКористувача()</text>

  <!-- Відповідь БД -->
  <line x1="535" y1="160" x2="395" y2="160" class="seq-ret" marker-end="url(#seq-open-v1)" />
  <text x="465" y="153" class="seq-lbl" text-anchor="middle">4: Запис користувача</text>

  <!-- Рамка alt -->
  <rect x="170" y="185" width="415" height="150" fill="none" stroke="#000000" stroke-width="1" />
  <rect x="170" y="185" width="40" height="18" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="190" y="196" font-size="10" font-weight="700" text-anchor="middle">alt</text>
  <text x="220" y="196" font-size="11" font-weight="600">[пароль вірний]</text>

  <!-- Успішна відповідь -->
  <line x1="385" y1="220" x2="235" y2="220" class="seq-ret" marker-end="url(#seq-open-v1)" />
  <text x="310" y="213" class="seq-lbl" text-anchor="middle">5: 200 OK (Токен доступу)</text>

  <!-- Роздільник гілки -->
  <line x1="170" y1="250" x2="585" y2="250" class="seq-alt" />
  <text x="220" y="265" font-size="11" font-weight="600">[помилка]</text>

  <!-- Відповідь з помилкою -->
  <line x1="385" y1="295" x2="235" y2="295" class="seq-ret" marker-end="url(#seq-open-v1)" />
  <text x="310" y="288" class="seq-lbl" text-anchor="middle">6: 401 Помилка доступу</text>

  <!-- Відображення результату -->
  <line x1="225" y1="380" x2="85" y2="380" class="seq-ret" marker-end="url(#seq-open-v1)" />
  <text x="155" y="373" class="seq-lbl" text-anchor="middle">7: Оновлення екрана</text>
</svg>
