<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Inheritance marker -->
    <marker id="cls-inh-v1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </marker>
    <!-- Composition marker -->
    <marker id="cls-comp-v1" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,6 6,0 12,6 6,12" fill="#000000" stroke="#000000" stroke-width="1.5" />
    </marker>
    <style>
      .cls-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .cls-div { stroke: #000000; stroke-width: 1.25; }
      .cls-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cls-title { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .cls-stereo { font-size: 11px; font-style: italic; fill: #000000; text-anchor: middle; }
      .cls-body { font-size: 11px; fill: #000000; font-family: 'Consolas', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- 1. Базовий клас: Користувач -->
  <g id="class-user">
    <rect x="60" y="20" width="230" height="145" class="cls-box" />
    <text x="175" y="40" class="cls-title">Користувач</text>
    <line x1="60" y1="55" x2="290" y2="55" class="cls-div" />
    <!-- Атрибути -->
    <text x="70" y="73" class="cls-body"># ідентифікатор: int</text>
    <text x="70" y="90" class="cls-body"># елПошта: string</text>
    <text x="70" y="107" class="cls-body">- хешПароля: string</text>
    <line x1="60" y1="117" x2="290" y2="117" class="cls-div" />
    <!-- Методи -->
    <text x="70" y="133" class="cls-body">+ отриматиПошту(): string</text>
    <text x="70" y="150" class="cls-body">+ перевіритиПароль(п): bool</text>
  </g>

  <!-- 2. Інтерфейс: ІРепозиторій -->
  <g id="interface-repo">
    <rect x="380" y="20" width="220" height="90" class="cls-box" />
    <text x="490" y="36" class="cls-stereo">&lt;&lt;інтерфейс&gt;&gt;</text>
    <text x="490" y="50" class="cls-title">ІРепозиторійКористувачів</text>
    <line x1="380" y1="60" x2="600" y2="60" class="cls-div" />
    <text x="390" y="78" class="cls-body">+ знайтиЗаІд(ід: int): Користувач</text>
    <text x="390" y="96" class="cls-body">+ зберегти(к: Користувач): bool</text>
  </g>

  <!-- 3. Дочірній клас: Студент -->
  <g id="class-student">
    <rect x="40" y="240" width="180" height="105" class="cls-box" />
    <text x="130" y="260" class="cls-title">Студент</text>
    <line x1="40" y1="273" x2="220" y2="273" class="cls-div" />
    <text x="50" y="291" class="cls-body">- номерКвитка: string</text>
    <text x="50" y="308" class="cls-body">- академГрупа: string</text>
    <line x1="40" y1="318" x2="220" y2="318" class="cls-div" />
    <text x="50" y="334" class="cls-body">+ середнійБал(): float</text>
  </g>

  <!-- 4. Дочірній клас: Викладач -->
  <g id="class-teacher">
    <rect x="240" y="240" width="180" height="105" class="cls-box" />
    <text x="330" y="260" class="cls-title">Викладач</text>
    <line x1="240" y1="273" x2="420" y2="273" class="cls-div" />
    <text x="250" y="291" class="cls-body">- кафедра: string</text>
    <text x="250" y="308" class="cls-body">- вченеЗвання: string</text>
    <line x1="240" y1="318" x2="420" y2="318" class="cls-div" />
    <text x="250" y="334" class="cls-body">+ виставитиОцінку(): void</text>
  </g>

  <!-- Наслідування: Студент -> Користувач -->
  <line x1="130" y1="240" x2="130" y2="200" class="cls-line" />
  <line x1="130" y1="200" x2="175" y2="200" class="cls-line" />
  <line x1="175" y1="200" x2="175" y2="166" class="cls-line" marker-end="url(#cls-inh-v1)" />

  <!-- Наслідування: Викладач -> Користувач -->
  <line x1="330" y1="240" x2="330" y2="200" class="cls-line" />
  <line x1="330" y1="200" x2="175" y2="200" class="cls-line" />

  <!-- 5. Клас: СервісКористувачів -->
  <g id="class-service">
    <rect x="450" y="235" width="190" height="110" class="cls-box" />
    <text x="545" y="255" class="cls-title">СервісКористувачів</text>
    <line x1="450" y1="268" x2="640" y2="268" class="cls-div" />
    <text x="460" y="286" class="cls-body">- репо: ІРепозиторій</text>
    <line x1="450" y1="296" x2="640" y2="296" class="cls-div" />
    <text x="460" y="314" class="cls-body">+ створити(): Користувач</text>
    <text x="460" y="331" class="cls-body">+ вхід(пошта, пароль): bool</text>
  </g>

  <!-- Зв'язок композиції/агрегації -->
  <line x1="490" y1="110" x2="490" y2="170" class="cls-line" />
  <line x1="490" y1="170" x2="545" y2="170" class="cls-line" />
  <line x1="545" y1="170" x2="545" y2="235" class="cls-line" marker-start="url(#cls-comp-v1)" />
</svg>
