<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="gost-arrow-v1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .block { stroke: #000000; stroke-width: 1.5; fill: #ffffff; }
      .txt { font-size: 13px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-size: 12px; font-weight: 600; fill: #000000; }
    </style>
  </defs>

  <!-- 1. Початок (Термінатор) -->
  <rect x="145" y="20" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="220" y="39" class="txt">Початок</text>

  <!-- Лінія 1 -->
  <line x1="220" y1="58" x2="220" y2="88" class="line" marker-end="url(#gost-arrow-v1)" />

  <!-- 2. Введення даних (Паралелограм: скіс 20px) -->
  <polygon points="150,88 310,88 290,128 130,128" class="block" />
  <text x="220" y="108" class="txt">Введення: a, b</text>

  <!-- Лінія 2 -->
  <line x1="220" y1="128" x2="220" y2="158" class="line" marker-end="url(#gost-arrow-v1)" />

  <!-- 3. Умова (Ромб) -->
  <polygon points="220,158 310,198 220,238 130,198" class="block" />
  <text x="220" y="198" class="txt">a &gt; b</text>

  <!-- Гілка "Так" (праворуч) -->
  <line x1="310" y1="198" x2="355" y2="198" class="line" />
  <line x1="355" y1="198" x2="355" y2="260" class="line" marker-end="url(#gost-arrow-v1)" />
  <text x="320" y="190" class="lbl">Так</text>

  <!-- Дія "Так" -->
  <rect x="300" y="260" width="110" height="40" class="block" />
  <text x="355" y="280" class="txt">max = a</text>

  <!-- Гілка "Ні" (вниз) -->
  <line x1="220" y1="238" x2="220" y2="260" class="line" marker-end="url(#gost-arrow-v1)" />
  <text x="228" y="252" class="lbl">Ні</text>

  <!-- Дія "Ні" -->
  <rect x="165" y="260" width="110" height="40" class="block" />
  <text x="220" y="280" class="txt">max = b</text>

  <!-- Зведення гілок -->
  <line x1="355" y1="300" x2="355" y2="330" class="line" />
  <line x1="355" y1="330" x2="220" y2="330" class="line" />
  <line x1="220" y1="300" x2="220" y2="358" class="line" marker-end="url(#gost-arrow-v1)" />

  <!-- 4. Виведення результату (Паралелограм) -->
  <polygon points="150,358 310,358 290,398 130,398" class="block" />
  <text x="220" y="378" class="txt">Виведення: max</text>

  <!-- Лінія 4 -->
  <line x1="220" y1="398" x2="220" y2="428" class="line" marker-end="url(#gost-arrow-v1)" />

  <!-- 5. Кінець (Термінатор) -->
  <rect x="145" y="428" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="220" y="447" class="txt">Кінець</text>
</svg>
