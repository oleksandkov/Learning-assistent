<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 640" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="gost-arrow-v1-2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .block { stroke: #000000; stroke-width: 1.5; fill: #ffffff; }
      .txt { font-size: 13px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-size: 12px; font-weight: 600; fill: #000000; }
    </style>
  </defs>

  <!-- 1. Початок -->
  <rect x="150" y="20" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="39" class="txt">Початок</text>

  <!-- Лінія до введення -->
  <line x1="225" y1="58" x2="225" y2="86" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- 2. Введення даних -->
  <polygon points="140,86 330,86 310,126 120,126" class="block" />
  <text x="225" y="106" class="txt">Введення: n, arr[0..n-1]</text>

  <!-- Лінія до ініціалізації -->
  <line x1="225" y1="126" x2="225" y2="154" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- 3. Процес: Ініціалізація -->
  <rect x="145" y="154" width="160" height="40" class="block" />
  <text x="225" y="174" class="txt">сума = 0;   i = 0</text>

  <!-- Лінія до точки повернення циклу -->
  <line x1="225" y1="194" x2="225" y2="230" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- 4. Умова циклу (Ромб) -->
  <polygon points="225,230 315,268 225,306 135,268" class="block" />
  <text x="225" y="268" class="txt">i &lt; n</text>

  <!-- Гілка "Так" (вниз - тіло циклу) -->
  <line x1="225" y1="306" x2="225" y2="336" class="line" marker-end="url(#gost-arrow-v1-2)" />
  <text x="233" y="320" class="lbl">Так</text>

  <!-- Дія 1 в циклі -->
  <rect x="135" y="336" width="180" height="40" class="block" />
  <text x="225" y="356" class="txt">сума = сума + arr[i]</text>

  <!-- Лінія до збільшення лічильника -->
  <line x1="225" y1="376" x2="225" y2="404" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- Дія 2 в циклі -->
  <rect x="150" y="404" width="150" height="40" class="block" />
  <text x="225" y="424" class="txt">i = i + 1</text>

  <!-- Зворотна лінія циклу (Feedback loop) -->
  <line x1="225" y1="444" x2="225" y2="466" class="line" />
  <line x1="225" y1="466" x2="65" y2="466" class="line" />
  <line x1="65" y1="466" x2="65" y2="216" class="line" />
  <line x1="65" y1="216" x2="225" y2="216" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- Гілка "Ні" (вихід праворуч) -->
  <line x1="315" y1="268" x2="385" y2="268" class="line" />
  <text x="325" y="260" class="lbl">Ні</text>
  <line x1="385" y1="268" x2="385" y2="488" class="line" />
  <line x1="385" y1="488" x2="225" y2="488" class="line" />
  <line x1="225" y1="488" x2="225" y2="510" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- 5. Виведення результату (Паралелограм) -->
  <polygon points="150,510 320,510 300,550 130,550" class="block" />
  <text x="225" y="530" class="txt">Виведення: сума</text>

  <!-- Лінія до кінця -->
  <line x1="225" y1="550" x2="225" y2="578" class="line" marker-end="url(#gost-arrow-v1-2)" />

  <!-- 6. Кінець -->
  <rect x="150" y="578" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="597" class="txt">Кінець</text>
</svg>
