<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 480" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="gost-arrow-v1-4" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
      .block { stroke: #000000; stroke-width: 1.5; fill: #ffffff; }
      .txt { font-size: 13px; font-weight: 500; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- 1. Початок -->
  <rect x="150" y="20" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="39" class="txt">Початок</text>

  <!-- Лінія -->
  <line x1="225" y1="58" x2="225" y2="92" class="line" marker-end="url(#gost-arrow-v1-4)" />

  <!-- 2. Введення даних -->
  <polygon points="140,92 330,92 310,132 120,132" class="block" />
  <text x="225" y="112" class="txt">Введення: arr, n</text>

  <!-- Лінія -->
  <line x1="225" y1="132" x2="225" y2="170" class="line" marker-end="url(#gost-arrow-v1-4)" />

  <!-- 3. Зумовлений процес (Підпрограма за ГОСТ 19.701) -->
  <g id="subroutine-block">
    <rect x="105" y="170" width="240" height="46" class="block" />
    <line x1="122" y1="170" x2="122" y2="216" class="line" />
    <line x1="328" y1="170" x2="328" y2="216" class="line" />
    <text x="225" y="193" class="txt">СортуванняВставками(arr, n)</text>
  </g>

  <!-- Лінія -->
  <line x1="225" y1="216" x2="225" y2="254" class="line" marker-end="url(#gost-arrow-v1-4)" />

  <!-- 4. Виведення результату -->
  <polygon points="140,254 330,254 310,294 120,294" class="block" />
  <text x="225" y="274" class="txt">Виведення: arr</text>

  <!-- Лінія -->
  <line x1="225" y1="294" x2="225" y2="332" class="line" marker-end="url(#gost-arrow-v1-4)" />

  <!-- 5. З'єднувач (Connector: коло за ГОСТ) -->
  <circle cx="225" cy="354" r="18" class="block" />
  <text x="225" y="355" class="txt" font-weight="700">1</text>

  <!-- Лінія -->
  <line x1="225" y1="372" x2="225" y2="408" class="line" marker-end="url(#gost-arrow-v1-4)" />

  <!-- 6. Кінець -->
  <rect x="150" y="408" width="150" height="38" rx="19" ry="19" class="block" />
  <text x="225" y="427" class="txt">Кінець</text>
</svg>
