<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1180" viewBox="0 0 800 1180" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- 1. ТОЧКА ВХОДУ MAIN -->
  <rect x="290" y="20" width="220" height="42" rx="21" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="400" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Початок main()</text>

  <line x1="400" y1="62" x2="400" y2="86" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 2. АВТОТЕСТУВАННЯ -->
  <rect x="160" y="86" width="480" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0d47a1">Виклик run_tests() [assert]</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#0d47a1">самоперевірка коректності сортувань на граничних вибірках</text>

  <line x1="400" y1="134" x2="400" y2="156" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 3. МЕНЮ ТА ВИБІР РЕЖИМУ -->
  <polygon points="170,156 630,156 610,198 150,198" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="390" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">Вибір режиму: Бенчмарк (1) / Одиночний тест (2) / Автотест (3)</text>

  <line x1="390" y1="198" x2="400" y2="222" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 4. ПІДПРОГРАМА INSERTION SORT ==================== -->
  <rect x="20" y="222" width="760" height="410" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="248" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#15803d">
    Підпрограма insertion_sort(a): Сортування вставкою [O(N²)]
  </text>

  <!-- Крок 4.1: Зовнішній цикл -->
  <rect x="150" y="260" width="500" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Зовнішній цикл: for (int i = 1; i &lt; n; ++i)</text>

  <line x1="400" y1="294" x2="400" y2="314" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.2: Ініціалізація ключа -->
  <rect x="180" y="314" width="440" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="336" text-anchor="middle" font-size="13.5" fill="#166534">Вибір поточного ключа: key = a[i];  j = i - 1;</text>

  <line x1="400" y1="348" x2="400" y2="368" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.3: Ромб перевірки умови зсуву -->
  <polygon points="400,368 530,396 400,424 270,396" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="400" y="401" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#15803d">j &gt;= 0 &amp;&amp; a[j] &gt; key ?</text>

  <!-- Гілка ТАК: зсув елемента вправо -->
  <line x1="530" y1="396" x2="630" y2="396" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="396" x2="630" y2="424" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="565" y="388" font-size="13.5" font-weight="bold" fill="#2e7d32">Так (Зсув)</text>

  <rect x="490" y="424" width="280" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="630" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">a[j + 1] = a[j];</text>
  <text x="630" y="457" text-anchor="middle" font-size="12.5" fill="#166534">--j; (повернення в цикл)</text>

  <!-- Зворотна петля внутрішнього циклу -->
  <line x1="630" y1="466" x2="630" y2="480" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="480" x2="400" y2="480" stroke="#2c3e50" stroke-width="1.8"/>

  <!-- Гілка НІ: знайдено позицію для вставки -->
  <line x1="270" y1="396" x2="170" y2="396" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="170" y1="396" x2="170" y2="430" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="205" y="388" font-size="13.5" font-weight="bold" fill="#c62828">Ні</text>

  <rect x="50" y="430" width="240" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="170" y="453" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Позицію знайдено</text>

  <line x1="170" y1="466" x2="170" y2="480" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="170" y1="480" x2="400" y2="480" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="400" y1="480" x2="400" y2="504" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.4: Вставка ключа -->
  <rect x="220" y="504" width="360" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="526" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Вставка: a[j + 1] = key;</text>

  <line x1="400" y1="538" x2="400" y2="560" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="200" y="560" width="400" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="582" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Масив впорядковано на місці [in-place]</text>

  <line x1="400" y1="594" x2="400" y2="648" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 5. ПІДПРОГРАМА TREE SORT ==================== -->
  <rect x="20" y="648" width="760" height="336" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="674" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c2410c">
    Підпрограма tree_sort(a): Сортування двійковим деревом [O(N log N)]
  </text>

  <!-- Крок 5.1: Ініціалізація дерева -->
  <rect x="170" y="688" width="460" height="32" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="709" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Ініціалізація: TreeNode* root = nullptr;</text>

  <line x1="400" y1="720" x2="400" y2="740" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.2: Побудова BST -->
  <rect x="90" y="740" width="620" height="48" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="760" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Побудова BST: for (int x : a) insert_bst(root, x);</text>
  <text x="400" y="776" text-anchor="middle" font-size="12.5" fill="#9a3412">вставка вліво/вправо з урахуванням дублікатів (++count)</text>

  <line x1="400" y1="788" x2="400" y2="808" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.3: Центрований обхід inorder -->
  <rect x="90" y="808" width="620" height="48" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="828" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Центрований обхід (Inorder Traversal): inorder(root, a, idx);</text>
  <text x="400" y="844" text-anchor="middle" font-size="12.5" fill="#9a3412">рекурсивний збір ключів: Left -&gt; Root -&gt; Right у вихідний масив</text>

  <line x1="400" y1="856" x2="400" y2="876" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.4: Звільнення дерева -->
  <rect x="150" y="876" width="500" height="34" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="898" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Звільнення динамічної пам'яті: free_tree(root);</text>

  <line x1="400" y1="910" x2="400" y2="930" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="220" y="930" width="360" height="32" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="951" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#c2410c">Масив повністю відсортовано</text>

  <line x1="400" y1="962" x2="400" y2="1000" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 6. ВИВІД ТА ЗАВЕРШЕННЯ ==================== -->
  <rect x="130" y="1000" width="540" height="42" rx="6" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="400" y="1025" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#bf360c">Форматування та друк таблиці вимірювань (chrono)</text>

  <line x1="400" y1="1042" x2="400" y2="1066" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="290" y="1066" width="220" height="42" rx="21" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="400" y="1092" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Кінець (return 0)</text>
</svg>
