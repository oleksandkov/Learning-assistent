<text x="320" y="116" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">Введення: масив a, n</text>
<rect x="245" y="168" width="150" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="320" y="188" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">i = 1</text>
<polygon points="320,240 445,288 320,336 195,288" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="320" y="288" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">i &lt; n ?</text>
<rect x="210" y="365" width="220" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="320" y="390" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">key = a[i],  j = i</text>
<polygon points="320,460 490,520 320,580 150,520" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="320" y="510" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">j &gt; 0 та</text>
<text x="320" y="532" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">a[j-1] &gt; key ?</text>
<rect x="20" y="600" width="190" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="115" y="615" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">a[j] = a[j-1]</text>
<text x="115" y="637" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">j = j - 1</text>
<rect x="235" y="625" width="190" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="330" y="642" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">a[j] = key</text>
<text x="330" y="664" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="16">i = i + 1</text>
<rect x="235" y="810" width="170" height="40" rx="20" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
