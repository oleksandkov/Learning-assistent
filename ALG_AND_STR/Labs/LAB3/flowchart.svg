<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1150" viewBox="0 0 800 1150" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- 1. ТОЧКА ВХОДУ MAIN -->
  <rect x="290" y="20" width="220" height="42" rx="21" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="400" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Початок main()</text>

  <line x1="400" y1="62" x2="400" y2="86" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 2. АВТОТЕСТУВАННЯ -->
  <rect x="160" y="86" width="480" height="48" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0d47a1">Виклик run_tests() [assert]</text>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#0d47a1">самоперевірка інваріантів двозв'язного списку та гілок</text>

  <line x1="400" y1="134" x2="400" y2="156" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 3. ІНІЦІАЛІЗАЦІЯ СТРУКТУРИ -->
  <rect x="150" y="156" width="500" height="48" rx="6" fill="#f5f5f5" stroke="#424242" stroke-width="2"/>
  <text x="400" y="177" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#212121">Ініціалізація DoublyBranchedList list</text>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#616161">head = nullptr, tail = nullptr, count = 0, K = 3, N = 10</text>

  <line x1="400" y1="204" x2="400" y2="226" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 4. МЕНЮ ТА ОПЕРАЦІЇ -->
  <polygon points="170,226 630,226 610,268 150,268" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="390" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">Вивід консольного меню та вибір операцій (1..6, 0 - вихід)</text>

  <line x1="390" y1="268" x2="400" y2="292" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 5. ПІДПРОГРАМА PUSH_BACK -->
  <rect x="20" y="292" width="760" height="442" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="318" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#15803d">
    Підпрограма push_back(name, nums): Додавання елемента та побудова гілки
  </text>

  <!-- Крок 5.1: Створення Node -->
  <rect x="100" y="332" width="600" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="355" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Створення Node*: node-&gt;name = name, total = min(nums.size, N)</text>

  <line x1="400" y1="368" x2="400" y2="388" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.2: Копіювання чисел -->
  <rect x="140" y="388" width="520" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="410" text-anchor="middle" font-size="13.5" fill="#166534">Копіювання min(total, K) чисел у node-&gt;main_nums</text>

  <line x1="400" y1="422" x2="400" y2="442" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.3: Ромб перевірки гілки: total > K ? -->
  <polygon points="400,442 520,470 400,498 280,470" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="400" y="475" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#15803d">total &gt; K ?</text>

  <!-- Гілка ТАК: формування BranchNode (праворуч) -->
  <line x1="520" y1="470" x2="610" y2="470" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="610" y1="470" x2="610" y2="498" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="555" y="461" font-size="13.5" font-weight="bold" fill="#2e7d32">Так</text>

  <rect x="450" y="498" width="320" height="44" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="610" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Створення списку BranchNode</text>
  <text x="610" y="532" text-anchor="middle" font-size="12.5" fill="#166534">для чисел від K до total-1</text>

  <!-- Гілка НІ: без гілки (ліворуч) -->
  <line x1="280" y1="470" x2="190" y2="470" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="470" x2="190" y2="498" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="235" y="461" font-size="13.5" font-weight="bold" fill="#c62828">Ні</text>

  <rect x="50" y="498" width="280" height="44" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="190" y="525" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">node-&gt;branch = nullptr</text>

  <!-- Зведення після вибору гілки -->
  <line x1="610" y1="542" x2="610" y2="560" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="610" y1="560" x2="400" y2="560" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="542" x2="190" y2="560" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="560" x2="400" y2="560" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="400" y1="560" x2="400" y2="578" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.4: Ромб вставки: tail == nullptr ? -->
  <polygon points="400,578 520,606 400,634 280,606" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="400" y="611" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#15803d">tail == nullptr ?</text>

  <!-- Гілка ТАК (список порожній, ліворуч) -->
  <line x1="280" y1="606" x2="190" y2="606" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="606" x2="190" y2="634" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="230" y="597" font-size="13.5" font-weight="bold" fill="#2e7d32">Так</text>

  <rect x="50" y="634" width="280" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="190" y="660" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">head = tail = node</text>

  <!-- Гілка НІ (додавання у двозв'язний хвіст, праворуч) -->
  <line x1="520" y1="606" x2="610" y2="606" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="610" y1="606" x2="610" y2="634" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="565" y="597" font-size="13.5" font-weight="bold" fill="#c62828">Ні</text>

  <rect x="450" y="634" width="320" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="610" y="651" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">tail-&gt;next = node; node-&gt;prev = tail;</text>
  <text x="610" y="666" text-anchor="middle" font-size="12.5" fill="#166534">tail = node;</text>

  <!-- Зведення після вставки -->
  <line x1="610" y1="676" x2="610" y2="690" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="610" y1="690" x2="400" y2="690" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="676" x2="190" y2="690" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="190" y1="690" x2="400" y2="690" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="400" y1="690" x2="400" y2="702" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.5: Інкремент та фінал підпрограми -->
  <rect x="240" y="702" width="320" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="724" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">++count;  return true;</text>

  <line x1="400" y1="736" x2="400" y2="764" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 6. ПІДПРОГРАМА REMOVE -->
  <rect x="20" y="764" width="760" height="266" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="788" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c2410c">
    Підпрограма remove(name): Пошук, переприв'язка зв'язків та видалення
  </text>

  <!-- Крок 6.1: Пошук елемента -->
  <rect x="60" y="802" width="680" height="34" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="824" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">curr = head;  while (curr &amp;&amp; curr-&gt;name != name) curr = curr-&gt;next;</text>

  <line x1="400" y1="836" x2="400" y2="854" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 6.2: Ромб curr != nullptr ? -->
  <polygon points="400,854 520,882 400,910 280,882" fill="#ffffff" stroke="#ea580c" stroke-width="2.2"/>
  <text x="400" y="887" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#c2410c">curr != nullptr ?</text>

  <!-- Гілка ТАК: видалення та переприв'язка (ліворуч) -->
  <line x1="280" y1="882" x2="250" y2="882" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="250" y1="882" x2="250" y2="910" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="265" y="873" font-size="13.5" font-weight="bold" fill="#2e7d32">Так</text>

  <rect x="35" y="910" width="430" height="66" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="250" y="928" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">Переприв'язка покажчиків двозв'язного списку:</text>
  <text x="250" y="944" text-anchor="middle" font-size="12" fill="#9a3412">(prev ? prev-&gt;next = next : head = next); (next ? next-&gt;prev = prev : tail = prev);</text>
  <text x="250" y="961" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">free_branch(curr-&gt;branch);  delete curr;  --count;</text>

  <!-- Гілка НІ: не знайдено (праворуч) -->
  <line x1="520" y1="882" x2="630" y2="882" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="882" x2="630" y2="920" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="575" y="873" font-size="13.5" font-weight="bold" fill="#c62828">Ні</text>

  <rect x="505" y="920" width="250" height="44" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="630" y="940" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">Друк: 'Вузол не знайдено'</text>
  <text x="630" y="955" text-anchor="middle" font-size="12.5" fill="#9a3412">return false;</text>

  <!-- Зведення після видалення -->
  <line x1="250" y1="976" x2="250" y2="988" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="250" y1="988" x2="400" y2="988" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="964" x2="630" y2="988" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="988" x2="400" y2="988" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="400" y1="988" x2="400" y2="998" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="260" y="998" width="280" height="26" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="1016" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Завершення операції видалення</text>

  <!-- 7. ОЧИЩЕННЯ ТА ЗАВЕРШЕННЯ -->
  <line x1="400" y1="1024" x2="400" y2="1048" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="160" y="1048" width="480" height="38" rx="6" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="400" y="1072" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#bf360c">Очищення пам'яті: list.clear()</text>

  <line x1="400" y1="1086" x2="400" y2="1104" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="290" y="1104" width="220" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="400" y="1129" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Кінець (return 0)</text>
</svg>
