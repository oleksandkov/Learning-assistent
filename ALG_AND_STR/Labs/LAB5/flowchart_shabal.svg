<polyline points="300,142 300,172" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,222 300,252" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,292 300,330" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,375 300,420" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,470 300,500" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,540 300,575" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="300,615 300,665" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
