<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1180" viewBox="0 0 800 1180" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- 1. ТОЧКА ВХОДУ MAIN -->
  <rect x="290" y="18" width="220" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="400" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Початок main()</text>

  <line x1="400" y1="58" x2="400" y2="80" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 2. АВТОТЕСТИ ТА ІНІЦІАЛІЗАЦІЯ -->
  <rect x="150" y="80" width="500" height="46" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="101" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0d47a1">run_tests() [assert] / Ініціалізація таблиці</text>
  <text x="400" y="118" text-anchor="middle" font-size="12.5" fill="#0d47a1">Перевірка еталонних векторів SHABAL-256 та цілісності файлу</text>

  <line x1="400" y1="126" x2="400" y2="148" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 3. ГОЛОВНЕ МЕНЮ -->
  <polygon points="170,148 630,148 610,188 150,188" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="390" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">Вибір опції: Хеш рядка / Файл (3б) / Хеш-таблиця / Бенчмарк</text>

  <line x1="390" y1="188" x2="400" y2="210" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 4. БЛОК SHABAL-256 ==================== -->
  <rect x="20" y="210" width="760" height="370" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="234" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#15803d">
    Підпрограма Shabal256::finalize(): Обчислення хешу SHABAL-256
  </text>

  <!-- Крок 4.1: Доповнення блоку -->
  <rect x="150" y="246" width="500" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="268" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Доповнення даних (Padding): buffer[len] = 0x80, далі нулі до 64 байтів</text>

  <line x1="400" y1="280" x2="400" y2="300" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.2: Декодування слів M -->
  <rect x="160" y="300" width="480" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="322" text-anchor="middle" font-size="13.5" fill="#166534">Розбиття блоку на 16 слів M[0..15]; Додавання: B[i] = B[i] + M[i]</text>

  <line x1="400" y1="334" x2="400" y2="354" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.3: Перестановка P -->
  <rect x="120" y="354" width="560" height="48" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="374" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Криптографічна перестановка perm(M): 48 раундів perm_elt()</text>
  <text x="400" y="392" text-anchor="middle" font-size="12.5" fill="#166534">Зсуви регістрів rotl32, нелінійна дифузія A, B та C, інверсія бітів</text>

  <line x1="400" y1="402" x2="400" y2="422" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.4: Фінальні 3 раунди -->
  <rect x="160" y="422" width="480" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="444" text-anchor="middle" font-size="13.5" fill="#166534">Цикл фіналізації: 3 раунди { swap(B, C); xor_w(); perm(M); }</text>

  <line x1="400" y1="456" x2="400" y2="476" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 4.5: Формування результату -->
  <rect x="180" y="476" width="440" height="36" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="499" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">Вибірка слів B[8..15] -> 32 байти (256 бітів) хеш-коду</text>

  <line x1="400" y1="512" x2="400" y2="532" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="220" y="532" width="360" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="554" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Повернення 64-символьного hex-рядка</text>

  <line x1="400" y1="566" x2="400" y2="600" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 5. БЛОК ХЕШ-ТАБЛИЦІ (CHAINING) ==================== -->
  <rect x="20" y="600" width="760" height="360" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="400" y="624" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c2410c">
    Підпрограма HashTable::insert(key, value): Вставка з методом ланцюгів
  </text>

  <!-- Крок 5.1: Обчислення індексу -->
  <rect x="160" y="638" width="480" height="34" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="660" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">
    Обчислення індексу: idx = hash(key) % capacity
  </text>

  <line x1="400" y1="672" x2="400" y2="694" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.2: Ромб пошуку ключа в ланцюгу -->
  <polygon points="400,694 530,724 400,754 270,724" fill="#ffffff" stroke="#ea580c" stroke-width="2.2"/>
  <text x="400" y="729" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">Ключ є в buckets[idx]?</text>

  <!-- Гілка ТАК: оновлення значення -->
  <line x1="530" y1="724" x2="630" y2="724" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="724" x2="630" y2="762" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="560" y="716" font-size="13.5" font-weight="bold" fill="#2e7d32">Так</text>

  <rect x="500" y="762" width="260" height="42" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="630" y="782" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">entry.value = value;</text>
  <text x="630" y="797" text-anchor="middle" font-size="12.5" fill="#9a3412">return false; (оновлено)</text>

  <!-- Гілка НІ: додавання нового елемента -->
  <line x1="270" y1="724" x2="170" y2="724" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="170" y1="724" x2="170" y2="762" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="205" y="716" font-size="13.5" font-weight="bold" fill="#c62828">Ні</text>

  <rect x="40" y="762" width="260" height="42" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="170" y="782" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">buckets[idx].push_back(...);</text>
  <text x="170" y="797" text-anchor="middle" font-size="12.5" fill="#9a3412">++count; return true; (вставка)</text>

  <!-- Зведення гілок -->
  <line x1="170" y1="804" x2="170" y2="824" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="630" y1="804" x2="630" y2="824" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="170" y1="824" x2="630" y2="824" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="400" y1="824" x2="400" y2="846" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Крок 5.3: Статистика колізій -->
  <rect x="180" y="846" width="440" height="36" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="869" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">
    Оновлення статистики: коефіцієнт α = n/m, підрахунок колізій
  </text>

  <line x1="400" y1="882" x2="400" y2="904" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="220" y="904" width="360" height="34" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="926" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">Операцію вставки завершено за О(1)</text>

  <line x1="400" y1="938" x2="400" y2="980" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ==================== 6. БЛОК КОНТРОЛЮ ФАЙЛУ (3б) ==================== -->
  <rect x="140" y="980" width="520" height="54" rx="6" fill="#ede7f6" stroke="#512da8" stroke-width="2"/>
  <text x="400" y="1003" text-anchor="middle" font-size="14" font-weight="bold" fill="#311b92">Завдання 3б: Контрольна сума файлу (SHABAL-256)</text>
  <text x="400" y="1022" text-anchor="middle" font-size="12.5" fill="#311b92">Дописування маркера в кінець файлу та перевірка відсутності модифікацій</text>

  <line x1="400" y1="1034" x2="400" y2="1064" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- 7. ВИТОК ЗАВЕРШЕННЯ -->
  <rect x="170" y="1064" width="460" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="1090" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0369a1">Вивід результатів, порівняльних таблиць та вихід (0)</text>

  <line x1="400" y1="1106" x2="400" y2="1126" stroke="#2c3e50" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="300" y="1126" width="200" height="38" rx="19" fill="#ffebee" stroke="#c62828" stroke-width="2.2"/>
  <text x="400" y="1150" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b71c1c">Кінець роботи</text>
</svg>
