<text x="360" y="272" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="15">index = h &gt;&gt; (32 − p)</text>
<text x="360" y="291" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="15">p = 13</text>
<polygon points="265,336 485,336 455,388 235,388" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
