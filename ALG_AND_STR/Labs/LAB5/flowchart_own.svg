<text x="360" y="190" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="15">h = (k × S) mod 2³²</text>
<text x="360" y="209" text-anchor="middle" dominant-baseline="central" fill="#000000" font-size="15">S = 2654435769</text>
